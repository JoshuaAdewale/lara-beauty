# Netlify configuration — Lara Beauty Atelier
# Static site: no build step, no dependencies.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------
# Security headers (applied site-wide)
# ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Keep the staff portal out of search engines and caches
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/admin.js"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, max-age=0"

# ---------------------------------------------------------------
# Caching — images and fonts are immutable, HTML must stay fresh
# ---------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------
# Friendly URLs
# ---------------------------------------------------------------
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/shop"
  to = "/index.html"
  status = 200

# Anything unmatched falls back to the storefront (hash routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
