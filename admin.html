<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">

  <title>Staff Portal · Lara Beauty Atelier</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow">

  <link rel="icon" href="assets/favicon.png">

  <!-- Fonts are self-hosted (see @font-face in styles.css). The storefront was
       moved off Google Fonts for GDPR reasons; the admin had been left behind,
       which the Content-Security-Policy caught. No third-party requests now. -->
  <script>(function(){try{var t=localStorage.getItem('lba_theme');
  if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  if(t==='light')document.documentElement.setAttribute('data-theme','light');
  }catch(e){}})();</script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- ===================================================================
       Sign in — shown until app.js confirms a valid session
       =================================================================== -->
  <main class="login" id="login" hidden>
    <div class="login-box">
      <img src="assets/logo-transparent.png" alt="Lara Beauty Atelier" width="96" height="94">
      <h1>Staff Portal</h1>
      <p class="muted">Authorised personnel only</p>

      <form id="login-form" autocomplete="off">
        <p class="f">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="you@larabeauty.ng" required autocomplete="off">
        </p>
        <p class="f">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="new-password">
        </p>
        <!-- Authorises writes to the live store. Held in sessionStorage only,
             so it is gone when the tab closes and never sits in the source. -->
        <p class="f">
          <label for="login-token">Publishing key <span class="muted">(optional)</span></label>
          <input type="password" id="login-token" placeholder="Leave blank to work offline" autocomplete="off">
          <small class="hint">Needed to publish reviews to the live site. Set as
            <code>ADMIN_TOKEN</code> in your Netlify environment variables.</small>
        </p>
        <button type="submit" class="btn btn-primary btn-block login-submit">Sign in</button>
      </form>

      <p class="hint lockout" id="lockout" role="alert" hidden></p>
      <p class="hint">This area is restricted. All activity is logged.</p>
      <p class="hint"><a class="back-link" href="index.html">← Back to storefront</a></p>
    </div>
  </main>

  <!-- ===================================================================
       Dashboard
       =================================================================== -->
  <div class="adm" id="app" hidden>

    <aside class="side" id="sidebar" aria-label="Admin sections">
      <a class="logo" href="index.html" target="_blank" rel="noopener">
        <img src="assets/logo-transparent.png" alt="" width="40" height="39">
        <span class="lt"><b>LARA BEAUTY</b><small>Admin</small></span>
      </a>

      <nav class="side-nav" aria-label="Admin navigation">
        <button type="button" data-view="dash">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h7V4H4zM13 9h7V4h-7zM13 20h7v-9h-7zM4 20h7v-5H4z"/></svg>
          Dashboard
        </button>
        <button type="button" data-view="orders">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
          Orders
        </button>
        <button type="button" data-view="messages">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3z"/><path d="m3 7 9 6 9-6"/></svg>
          Messages <span class="msg-badge" id="msg-badge" hidden></span>
        </button>
        <button type="button" data-view="pages">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg>
          Pages &amp; Content
        </button>
        <button type="button" data-view="categories">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          Categories
        </button>
        <button type="button" data-view="media">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"/><circle cx="9" cy="10" r="2"/><path d="m5 18 5-5 3 3 3-3 3 3"/></svg>
          Media
        </button>
        <button type="button" data-view="products">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>
          Products
        </button>
        <button type="button" data-view="inventory">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v13H4z"/><path d="M4 7l2-3h12l2 3M9 12h6"/></svg>
          Inventory
        </button>
        <button type="button" data-view="customers">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
          Customers
        </button>
        <button type="button" data-view="reviews">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.6 5.6 6 .7-4.4 4 1.2 6L12 16.4 6.6 19.3l1.2-6-4.4-4 6-.7z"/></svg>
          Reviews
        </button>
        <button type="button" data-view="marketing">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h4l8-5v14l-8-5H3z"/><path d="M18 9a4 4 0 0 1 0 6"/></svg>
          Marketing
        </button>
        <button type="button" data-view="analytics">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16"/><path d="m7 15 4-5 3 3 5-7"/></svg>
          Analytics
        </button>
        <button type="button" data-view="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
          Settings
        </button>
      </nav>

      <div class="sep">
        <p class="who" id="who"></p>
        <a href="index.html" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M12 4l8 8-8 8"/></svg>
          View storefront
        </a>
        <button type="button" data-action="logout">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2"/><path d="M9 12h11l-3-3M20 12l-3 3"/></svg>
          Sign out
        </button>
      </div>
    </aside>

    <main class="amain">
      <header class="abar">
        <div class="abar-title">
          <button type="button" class="icon-btn aburger" data-action="toggle-sidebar"
                  aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div>
            <h1 id="view-title">Dashboard</h1>
            <p class="sub" id="view-sub"></p>
          </div>
        </div>

        <!-- Contextual: nav() shows only the buttons that apply to the current view. -->
        <div class="abar-actions" id="abar-actions"></div>
        <button type="button" class="btn btn-ghost btn-sm theme-btn" data-action="theme"
                aria-label="Switch between light and dark theme">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </header>

      <!-- Sits above the view on every screen. Shows what is waiting to go
           live and is the only route to publishing. -->
      <div class="publish-bar" id="publish-bar" hidden></div>
      <div id="security-notice" hidden></div>

      <div id="view"></div>
    </main>
  </div>

  <!-- Primary modal: forms and record detail -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" hidden>
    <div class="modal-box" id="modal-body"></div>
  </div>

  <!-- Secondary modal: media picker, stacked above the primary -->
  <div class="modal modal-stacked" id="modal2" role="dialog" aria-modal="true" hidden>
    <div class="modal-box" id="modal2-body"></div>
  </div>

  <p class="toast" id="toast" role="status" aria-live="polite"></p>

  <script src="data.js"></script>
  <script src="store.js"></script>
  <script src="api.js"></script>
  <script src="email.js"></script>
  <script src="admin.js"></script>
</body>
</html>
